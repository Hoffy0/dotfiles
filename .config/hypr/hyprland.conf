# █░░ ▄▀█ █░█ █▄░█ █▀▀ █░█
# █▄▄ █▀█ █▄█ █░▀█ █▄▄ █▀█

# See https://wiki.hyprland.org/Configuring/Keywords/

# exec-once = $HOME/bin/resetxdgportal.sh
#exec-once = [workspace 1 silent] kitty
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# exec-once = $HOME/bin/polkitkdeauth.sh # authentication dialogue for GUI apps
# Reemplazamos Dunst por SwayNC
# exec-once = swaync
# exec-once = hypridle
# exec-once = swww-daemon
# exec-once = bash $binPath/set-wallpaper.sh --current
exec-once = lxpolkit
# Via systemd para que se reinicie solo si muere (ver
# .config/systemd/user/noctalia-shell.service). reset-failed limpia el estado
# si en la sesion anterior systemd se rindio por el rate limit.
exec-once = bash -c 'systemctl --user reset-failed noctalia-shell.service 2>/dev/null; systemctl --user restart noctalia-shell.service'
# exec-once = swww init
# exec-once = udiskie --no-automount --smart-tray
# exec-once = wl-paste --type text --watch cliphist store    # lo lanza noctalia (appLauncher.clipboardWatchTextCommand)
# exec-once = wl-paste --type image --watch cliphist store   # lo lanza noctalia (appLauncher.clipboardWatchImageCommand)

#==> Launching waybar after applying the theme
# exec-once = python $meowrch --action set-current-theme && python $meowrch --action set-wallpaper && waybar
# exec-once = waybar --config ~/.config/waybar/config.jsonc
# exec-once = swayosd-server         # reemplazado por noctalia (osd)

# █▀▀ █▄░█ █░█
# ██▄ █░▀█ ▀▄▀

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# exec-once = sh -c 'function shenv() { export "$1=$2"; }; source ~/.env;'


# █ █▄░█ █▀█ █░█ ▀█▀
# █ █░▀█ █▀▀ █▄█ ░█░

# See https://wiki.hyprland.org/Configuring/Variables/

input {
      kb_layout = es
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0
    force_no_accel = 1
}

# See https://wiki.hyprland.org/Configuring/Keywords/#executing

device {
    name = epic mouse V1
    sensitivity = 0
}

# See https://wiki.hyprland.org/Configuring/Variables/

#gestures {
#    workspace_swipe = true
#    workspace_swipe_fingers = 3
#}


# █░░ ▄▀█ █▄█ █▀█ █░█ ▀█▀ █▀
# █▄▄ █▀█ ░█░ █▄█ █▄█ ░█░ ▄█

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/

dwindle {
    preserve_split = yes
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/

master {
    new_status = master
}


# █▀▄▀█ █ █▀ █▀▀
# █░▀░█ █ ▄█ █▄▄

# See https://wiki.hyprland.org/Configuring/Variables/

misc {
    vrr = 0
    # Da el foco a la app que lo pide (dialogos, links desde otra app)
    # en vez de solo marcarla como urgente.
    focus_on_activate = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

xwayland {
    force_zero_scaling = true
}
	

# █▀ █▀█ █░█ █▀█ █▀▀ █▀▀
# ▄█ █▄█ █▄█ █▀▄ █▄▄ ██▄

source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/nvidia.conf  # Quitar si no hay GPU NVIDIA (lspci | grep -i nvidia)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/custom-prefs.conf
