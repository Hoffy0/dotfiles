exec = hyprctl setcursor Bibata-Modern-Classic 24
exec = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Classic'
exec = gsettings set org.gnome.desktop.interface cursor-size 24


# █ █▀▀ █▀█ █▄░█   ▀█▀ █░█ █▀▀ █▀▄▀█ █▀▀
# █ █▄▄ █▄█ █░▀█   ░█░ █▀█ ██▄ █░▀░█ ██▄
exec = gsettings set org.gnome.desktop.interface icon-theme 'Tela-circle-dracula'


# █▀ █▀█ █▀▀ █▀▀ █ ▄▀█ █░░
# ▄█ █▀▀ ██▄ █▄▄ █ █▀█ █▄▄

decoration {
    dim_special = 0.3
    blur {
        special = true
    }
}

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 3
    col.active_border = rgb(b4befe) rgb(f5c2e7) 45deg
	col.inactive_border = rgba(00000000)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10

    # Pista visual de foco: las reglas de windowrules.conf usan el mismo valor
    # de opacidad para activo e inactivo, asi que sin esto no hay diferencia.
    dim_inactive = true
    dim_strength = 0.1

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000055)
    }

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        popups = true
        # xray: las ventanas difuminan solo el wallpaper, no las ventanas de atras.
        xray = true
    }
}

# Noctalia pide blur por su cuenta via ext-background-effect-v1 (BackgroundEffect.blurRegion),
# por region y con esquinas redondeadas. Un "layerrule = blur" encima difuminaria el rectangulo
# completo del layer, margenes transparentes incluidos = doble blur y peor resultado.
# Requiere Hyprland >= 0.56 (el protocolo no existe en 0.51).


# Efecto vidrio para notificaciones
# layerrule = blur, swaync-control-center
# layerrule = blur, swaync-notification-window
# layerrule = ignorezero, swaync-control-center
# layerrule = ignorezero, swaync-notification-window
# layerrule = ignorealpha 0.5, swaync-control-center
# layerrule = ignorealpha 0.5, swaync-notification-window