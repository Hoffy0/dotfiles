# Bloquea por inactividad y apaga las pantallas cuando esta bloqueado (evita quemar pixeles).
# Sin suspension: es una VM con la iGPU en passthrough.

$dpms_off = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
$dpms_on  = hyprctl dispatch 'hl.dsp.dpms({action="on"})'

general {
    lock_cmd = ~/bin/lock.sh
    before_sleep_cmd = loginctl lock-session
}

# 5 min sin actividad: bloquear
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 1 min sin actividad con la pantalla bloqueada: apagar monitores
listener {
    timeout = 60
    on-timeout = pidof hyprlock && $dpms_off
    on-resume = $dpms_on
}

# Bloqueo por inactividad (5 min) + 1 min: apagar monitores
# (el listener de 60 s ya se disparo antes de que existiera hyprlock)
listener {
    timeout = 360
    on-timeout = $dpms_off
    on-resume = $dpms_on
}
