
# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

# Sintaxis de Hyprland >= 0.53:
#   windowrule {
#       name = <nombre-unico>      <- OBLIGATORIO, y tiene que ir primero
#       match:class = ^(regex)$
#       <efecto> = <valor>
#   }
# El viejo "windowrulev2 = efecto, matcher" quedo deprecado.
# Campos en snake_case: no_blur, ignore_alpha, no_anim.

#--------------------------------------------------------------------------## OPACIDAD
windowrule {
    name = opacity-90
    match:class = ^(google-chrome|brave-browser|org.telegram.desktop|jetbrains-datagrip)$
    opacity = 0.90 0.90
}

windowrule {
    name = opacity-editors
    match:class = ^(code|antigravity)$
    opacity = 0.95 0.80
}

windowrule {
    name = opacity-ghostty
    match:class = ^(com.mitchellh.ghostty)$
    opacity = 0.90 0.75
}

windowrule {
    name = opacity-80-apps
    match:class = ^(code-oss|code-url-handler|code-insiders-url-handler|qt5ct|qt6ct|org.kde.ark|com.obsproject.Studio|Alacritty|blueman-manager|[Ss]team|steamwebhelper|discord|Spotify|WebCord|vesktop|yad|org.gnome.Evince|evince)$
    opacity = 0.80 0.80
}

windowrule {
    name = opacity-80-portals
    match:class = ^(org.kde.polkit-kde-authentication-agent-1|polkit-gnome-authentication-agent-1|org.freedesktop.impl.portal.desktop.gtk|org.freedesktop.impl.portal.desktop.hyprland)$
    opacity = 0.80 0.80
}

#--------------------------------------------------------------------------## FLOTANTES
windowrule {
    name = float-dialogs
    match:class = ^(vlc|1password|blueman-manager|qt5ct|qt6ct|org.kde.ark|yad|org.kde.polkit-kde-authentication-agent-1)$
    float = true
}

windowrule {
    name = float-firefox-pip
    match:class = ^(firefox)$
    match:title = ^(Picture-in-Picture)$
    float = true
}

windowrule {
    name = float-firefox-library
    match:class = ^(firefox)$
    match:title = ^(Library)$
    float = true
}

windowrule {
    name = float-portal-gtk
    match:class = ^(xdg-desktop-portal-gtk)$
    float = true
    center = true
}

#--------------------------------------------------------------------------## FLOTANTES CON TAMANO
windowrule {
    name = float-calculator
    match:class = ^(org.gnome.Calculator|gnome-calculator)$
    opacity = 0.80 0.80
    float = true
    center = true
    size = 360 500
}

windowrule {
    name = float-loupe
    match:class = ^(org.gnome.Loupe)$
    opacity = 0.90 0.90
    float = true
    center = true
    size = 1200 800
}

windowrule {
    name = float-pavucontrol
    match:class = ^(org.pulseaudio.pavucontrol)$
    opacity = 0.80 0.80
    float = true
    size = 920 450
}

windowrule {
    name = float-nautilus
    match:class = ^(org.gnome.Nautilus)$
    opacity = 0.80 0.80
    float = true
    center = true
}

#--------------------------------------------------------------------------## MISC
windowrule {
    name = noblur-sin-clase
    match:class = ^()$
    match:title = ^()$
    no_blur = true
}


# █░░ ▄▀█ █▄█ █▀▀ █▀█   █▀█ █░█ █░░ █▀▀ █▀
# █▄▄ █▀█ ░█░ ██▄ █▀▄   █▀▄ █▄█ █▄▄ ██▄ ▄█

# noctalia se blurea solo via ext-background-effect-v1, no lleva layerrule.
# "ignorezero" no existe en 0.56; el equivalente es ignore_alpha = 0.
layerrule {
    name = blur-rofi
    match:namespace = ^(rofi)$
    blur = true
    ignore_alpha = 0
}

layerrule {
    name = blur-notifications
    match:namespace = ^(notifications)$
    blur = true
    ignore_alpha = 0
}

layerrule {
    name = blur-logout
    match:namespace = ^(logout_dialog)$
    blur = true
}
