# Pantalla de bloqueo estilo GNOME (se lanza con ~/bin/lock.sh)

$font = Adwaita Sans
$main = DP-1

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = gnome, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, gnome
    animation = fadeOut, 1, 4, gnome
    animation = inputFieldDots, 1, 2, gnome
}

# Wallpaper desenfocado y oscurecido en todas las pantallas
background {
    monitor =
    path = /home/hoffy/.cache/hyprlock/bg
    color = rgb(1a1a1a)
    blur_passes = 3
    blur_size = 10
    brightness = 0.55
    vibrancy = 0.1
}

# Fecha
label {
    monitor = $main
    text = cmd[update:60000] LC_TIME=es_CL.UTF-8 date +"%A, %-d de %B" | sed 's/^./\U&/'
    color = rgba(255, 255, 255, 0.9)
    font_size = 22
    font_family = $font
    position = 0, 420
    halign = center
    valign = center
}

# Hora
label {
    monitor = $main
    text = <b>$TIME</b>
    color = rgba(255, 255, 255, 1.0)
    font_size = 110
    font_family = $font
    position = 0, 300
    halign = center
    valign = center
}

# Avatar
image {
    monitor = $main
    path = /var/lib/AccountsService/icons/hoffy
    size = 128
    rounding = -1
    border_size = 0
    position = 0, 20
    halign = center
    valign = center
}

# Nombre
label {
    monitor = $main
    text = $USER
    color = rgba(255, 255, 255, 1.0)
    font_size = 20
    font_family = Adwaita Sans Bold
    position = 0, -80
    halign = center
    valign = center
}

# Contraseña
input-field {
    monitor = $main
    size = 320, 50
    rounding = -1
    outline_thickness = 0
    inner_color = rgba(255, 255, 255, 0.12)
    font_color = rgb(ffffff)
    font_family = $font
    check_color = rgba(255, 255, 255, 0.25)
    fail_color = rgba(224, 27, 36, 0.6)
    fail_text = Contraseña incorrecta
    placeholder_text = <span foreground="##ffffff99">Contraseña</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    shadow_passes = 0
    position = 0, -150
    halign = center
    valign = center
}
